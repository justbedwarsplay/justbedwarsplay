name: Update GitHub Stats

on:
  schedule:
    # Запуск каждый день в 00:00 по UTC
    - cron: '0 0 * * *'
  # Возможность запустить вручную из вкладки Actions
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Генерация файла со статистикой (активность)
      - name: Generate stats image
        uses: cicirello/user-statistician@v1
        with:
          organization: 'justbedwarsplay'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          generated-stats-file: 'github-stats.svg'

      # Генерация файла с топом языков
      - name: Generate top languages image
        uses: cicirello/user-statistician@v1
        with:
          organization: 'justbedwarsplay'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          generated-stats-file: 'top-langs.svg'
          statistic: 'languages'

      # Коммит и пуш изменений обратно в репозиторий
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git diff --staged --quiet || git commit -m "Автоматическое обновление статистики"
          git push
