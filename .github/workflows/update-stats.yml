name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Каждый день в 00:00
  workflow_dispatch:      # Ручной запуск

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Генерация статистики активности
      - name: Generate stats image
        uses: cicirello/user-statistician@v1
        with:
          image-file: 'github-stats.svg'
          include-title: true
          custom-title: 'Активность на GitHub'
          colors: '["#2d8a4e", "#4caf50", "#81c784"]'
          hide-keys: false
          commit-and-push: false
          locale: 'ru'

      # Генерация топа языков (отдельный запуск)
      - name: Generate top languages image
        uses: cicirello/user-statistician@v1
        with:
          image-file: 'top-langs.svg'
          include-title: true
          custom-title: 'Топ языков программирования'
          colors: '["#2d8a4e", "#4caf50", "#81c784"]'
          hide-keys: false
          commit-and-push: false
          locale: 'ru'

      # Коммит и пуш изменений
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git diff --staged --quiet || git commit -m "Автоматическое обновление статистики [skip ci]"
          git push
